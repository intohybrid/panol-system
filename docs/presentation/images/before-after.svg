<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- ===== Lado izquierdo: ANTES (papel, manual) ===== -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="500" height="500" fill="#fafaf9"/>
    <text x="250" y="50" text-anchor="middle" fill="#78716c"
          font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700"
          letter-spacing="3">ANTES — PAPEL</text>
    <text x="250" y="78" text-anchor="middle" fill="#a8a29e"
          font-family="Inter,Arial,sans-serif" font-size="13" font-style="italic">
      registro manual, sin trazabilidad</text>

    <!-- Cuaderno con anotaciones desordenadas -->
    <g transform="translate(120,120)">
      <!-- Páginas apiladas -->
      <rect x="10" y="10" width="260" height="320" fill="url(#paperGrad)" stroke="#a16207" stroke-width="1" transform="rotate(2 140 170)"/>
      <rect x="0" y="0" width="260" height="320" fill="url(#paperGrad)" stroke="#a16207" stroke-width="1.5"/>

      <!-- Líneas tachadas / texto manuscrito -->
      <g stroke="#1e1b4b" stroke-width="1.2" stroke-linecap="round" fill="none">
        <line x1="20" y1="40" x2="220" y2="40"/>
        <line x1="20" y1="60" x2="180" y2="60"/>
        <line x1="20" y1="80" x2="200" y2="80"/>
        <line x1="20" y1="100" x2="120" y2="100"/>
        <line x1="20" y1="120" x2="200" y2="120"/>
        <!-- tachado -->
        <line x1="22" y1="58" x2="160" y2="62" stroke="#dc2626" stroke-width="2"/>
        <line x1="22" y1="118" x2="180" y2="122" stroke="#dc2626" stroke-width="2"/>
      </g>

      <!-- Manchas de tinta -->
      <ellipse cx="200" cy="170" rx="18" ry="6" fill="#1e1b4b" opacity="0.4"/>
      <circle cx="80" cy="220" r="4" fill="#dc2626" opacity="0.6"/>

      <g stroke="#1e1b4b" stroke-width="1.2" stroke-linecap="round" fill="none">
        <line x1="20" y1="160" x2="160" y2="160"/>
        <line x1="20" y1="200" x2="220" y2="200"/>
        <line x1="20" y1="240" x2="120" y2="240"/>
        <line x1="20" y1="260" x2="200" y2="260"/>
        <line x1="20" y1="280" x2="180" y2="280"/>
      </g>

      <!-- Signo de interrogación (no se entiende) -->
      <text x="225" y="265" font-family="Arial" font-size="24" fill="#dc2626" font-weight="700">?</text>
    </g>

    <!-- Pain points -->
    <g transform="translate(50,460)">
      <text x="0" y="0" fill="#9f1239" font-family="Inter,Arial,sans-serif"
            font-size="13" font-weight="600">⚠ Pérdidas no trazadas · ⚠ Cero reportes · ⚠ Tiempos largos</text>
    </g>
  </g>

  <!-- Línea divisoria -->
  <line x1="500" y1="40" x2="500" y2="460" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="500" y="260" text-anchor="middle" font-family="Arial" font-size="38" fill="#94a3b8">→</text>

  <!-- ===== Lado derecho: DESPUÉS (digital, dashboard) ===== -->
  <g transform="translate(500,0)">
    <rect x="0" y="0" width="500" height="500" fill="#fafaf9"/>
    <text x="250" y="50" text-anchor="middle" fill="#0f172a"
          font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700"
          letter-spacing="3">DESPUÉS — DIGITAL</text>
    <text x="250" y="78" text-anchor="middle" fill="#475569"
          font-family="Inter,Arial,sans-serif" font-size="13" font-style="italic">
      trazable, asistido por IA, en tiempo real</text>

    <!-- Laptop + tablet en cascada -->
    <g transform="translate(110,110)">
      <!-- Pantalla de laptop -->
      <rect x="0" y="0" width="280" height="180" rx="8" fill="url(#screenGrad)" stroke="#334155" stroke-width="2"/>
      <!-- Barra superior -->
      <rect x="0" y="0" width="280" height="18" fill="#334155" rx="8 8 0 0"/>
      <circle cx="10" cy="9" r="3" fill="#ef4444"/>
      <circle cx="22" cy="9" r="3" fill="#f59e0b"/>
      <circle cx="34" cy="9" r="3" fill="#22c55e"/>

      <!-- Header dashboard -->
      <text x="14" y="40" fill="#fafaf9" font-family="Inter,Arial,sans-serif"
            font-size="11" font-weight="700">SISTEMA DE PAÑOL — Dashboard</text>

      <!-- KPIs -->
      <g transform="translate(14,55)">
        <rect x="0" y="0" width="78" height="44" rx="4" fill="#1f2937" stroke="#334155"/>
        <text x="39" y="18" text-anchor="middle" fill="#22c55e" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">142</text>
        <text x="39" y="34" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="8">Préstamos hoy</text>

        <rect x="86" y="0" width="78" height="44" rx="4" fill="#1f2937" stroke="#334155"/>
        <text x="125" y="18" text-anchor="middle" fill="#3b82f6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">98%</text>
        <text x="125" y="34" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="8">A tiempo</text>

        <rect x="172" y="0" width="78" height="44" rx="4" fill="#1f2937" stroke="#334155"/>
        <text x="211" y="18" text-anchor="middle" fill="#f59e0b" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">3</text>
        <text x="211" y="34" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="8">Atrasos</text>
      </g>

      <!-- Mini gráfico de barras -->
      <g transform="translate(14,110)">
        <text x="0" y="-3" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="600">Tendencia semanal</text>
        <rect x="0" y="20" width="20" height="32" fill="#3b82f6" rx="1"/>
        <rect x="26" y="14" width="20" height="38" fill="#3b82f6" rx="1"/>
        <rect x="52" y="6" width="20" height="46" fill="#3b82f6" rx="1"/>
        <rect x="78" y="22" width="20" height="30" fill="#3b82f6" rx="1"/>
        <rect x="104" y="2" width="20" height="50" fill="#22c55e" rx="1"/>
        <rect x="130" y="10" width="20" height="42" fill="#22c55e" rx="1"/>
        <rect x="156" y="24" width="20" height="28" fill="#3b82f6" rx="1"/>

        <!-- Mini chip de IA al costado -->
        <g transform="translate(195,5)">
          <rect width="60" height="46" rx="6" fill="#7c3aed"/>
          <text x="30" y="18" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">IA</text>
          <text x="30" y="32" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="7">scoring</text>
          <text x="30" y="42" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="7">+ chat</text>
        </g>
      </g>

      <!-- Base de la laptop -->
      <rect x="-20" y="180" width="320" height="8" rx="2" fill="#334155"/>
      <rect x="-20" y="180" width="320" height="2" fill="#1e293b"/>
    </g>

    <!-- Burbuja de chat IA -->
    <g transform="translate(40,330)">
      <path d="M 0 0 L 180 0 Q 188 0 188 8 L 188 56 Q 188 64 180 64 L 30 64 L 12 80 L 16 64 L 0 64 Q -8 64 -8 56 L -8 8 Q -8 0 0 0 Z"
            fill="#7c3aed" stroke="#5b21b6" stroke-width="1"/>
      <text x="6" y="20" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">🤖 Asistente IA</text>
      <text x="6" y="38" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="9">"Te recomiendo el martillo</text>
      <text x="6" y="50" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="9">de carpintero #002 (3 disponibles)"</text>
    </g>

    <!-- Tarjeta de notificación in-app -->
    <g transform="translate(280,335)">
      <rect width="200" height="80" rx="6" fill="#fff" stroke="#22c55e" stroke-width="2"/>
      <circle cx="20" cy="20" r="10" fill="#22c55e"/>
      <text x="20" y="25" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="700">✓</text>
      <text x="40" y="22" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">Solicitud aprobada</text>
      <text x="20" y="48" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="9">Ticket: #PNL-2026-1234</text>
      <text x="20" y="62" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="9">Retira en: tótem A</text>
    </g>

    <!-- Wins -->
    <g transform="translate(40,470)">
      <text x="0" y="0" fill="#15803d" font-family="Inter,Arial,sans-serif"
            font-size="13" font-weight="600">✓ Trazable · ✓ Reportes en vivo · ✓ IA + tótem · ✓ Mesa redonda</text>
    </g>
  </g>
</svg>

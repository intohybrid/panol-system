<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGrad)"/>

  <!-- Título -->
  <text x="600" y="38" text-anchor="middle" fill="#0f172a"
        font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700"
        letter-spacing="3">SISTEMA DE PAÑOL — 3 INTERFACES</text>
  <text x="600" y="62" text-anchor="middle" fill="#64748b"
        font-family="Inter,Arial,sans-serif" font-size="13" font-style="italic">
        portal web (alumno) · tótem (pañolero) · asistente conversacional</text>

  <!-- ============ 1. PORTAL WEB (laptop) ============ -->
  <g transform="translate(40,100)">
    <text x="180" y="-10" text-anchor="middle" fill="#1e3a8a"
          font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700"
          letter-spacing="2">WEB-PORTAL · ALUMNO</text>

    <!-- Marco laptop -->
    <rect x="0" y="10" width="360" height="240" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Barra superior -->
    <rect x="0" y="10" width="360" height="22" fill="#1e293b" rx="6 6 0 0"/>
    <circle cx="14" cy="21" r="3.5" fill="#ef4444"/>
    <circle cx="28" cy="21" r="3.5" fill="#f59e0b"/>
    <circle cx="42" cy="21" r="3.5" fill="#22c55e"/>
    <text x="180" y="25" text-anchor="middle" fill="#94a3b8"
          font-family="Inter,Arial,sans-serif" font-size="9">panol.unab.cl/catalogo</text>

    <!-- Contenido portal -->
    <rect x="8" y="40" width="344" height="202" fill="#fafaf9" rx="2"/>

    <!-- Header con nav -->
    <rect x="8" y="40" width="344" height="28" fill="#1e3a8a"/>
    <text x="20" y="58" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">Pañol UNAB</text>
    <text x="100" y="58" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="9">Catálogo</text>
    <text x="155" y="58" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="9">Mi historial</text>
    <text x="220" y="58" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="9">Asistente</text>
    <circle cx="335" cy="54" r="9" fill="#3b82f6"/>
    <text x="335" y="58" text-anchor="middle" fill="#fff" font-family="Arial" font-size="9" font-weight="700">M</text>

    <!-- Buscador -->
    <rect x="20" y="78" width="320" height="22" rx="3" fill="#fff" stroke="#cbd5e1"/>
    <text x="28" y="93" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="10">🔍  buscar herramienta...</text>

    <!-- Tarjetas de recursos -->
    <g transform="translate(20,108)">
      <!-- Card 1 -->
      <rect width="100" height="120" rx="4" fill="#fff" stroke="#e2e8f0"/>
      <rect x="6" y="6" width="88" height="60" fill="#f59e0b" rx="2"/>
      <text x="50" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22">🔨</text>
      <text x="50" y="78" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">Martillo</text>
      <text x="50" y="92" text-anchor="middle" fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="600">3 disponibles</text>
      <rect x="6" y="100" width="88" height="14" rx="2" fill="#1e3a8a"/>
      <text x="50" y="111" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="700">+ AGREGAR</text>

      <!-- Card 2 -->
      <g transform="translate(110,0)">
        <rect width="100" height="120" rx="4" fill="#fff" stroke="#e2e8f0"/>
        <rect x="6" y="6" width="88" height="60" fill="#06b6d4" rx="2"/>
        <text x="50" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22">🔧</text>
        <text x="50" y="78" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">Llave 13mm</text>
        <text x="50" y="92" text-anchor="middle" fill="#dc2626" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="600">1 disponible</text>
        <rect x="6" y="100" width="88" height="14" rx="2" fill="#1e3a8a"/>
        <text x="50" y="111" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="700">+ AGREGAR</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(220,0)">
        <rect width="100" height="120" rx="4" fill="#fff" stroke="#e2e8f0"/>
        <rect x="6" y="6" width="88" height="60" fill="#a855f7" rx="2"/>
        <text x="50" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22">📐</text>
        <text x="50" y="78" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">Escuadra</text>
        <text x="50" y="92" text-anchor="middle" fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="600">12 disponibles</text>
        <rect x="6" y="100" width="88" height="14" rx="2" fill="#1e3a8a"/>
        <text x="50" y="111" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="700">+ AGREGAR</text>
      </g>
    </g>

    <!-- Base de la laptop -->
    <path d="M -20 250 L 380 250 L 360 268 L 0 268 Z" fill="#334155"/>
  </g>

  <!-- ============ 2. TÓTEM (tablet vertical) ============ -->
  <g transform="translate(450,80)">
    <text x="160" y="10" text-anchor="middle" fill="#0f172a"
          font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700"
          letter-spacing="2">TÓTEM · PAÑOLERO</text>

    <!-- Marco tablet -->
    <rect x="40" y="30" width="240" height="430" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
    <rect x="50" y="50" width="220" height="390" fill="#0f172a" rx="4"/>

    <!-- Indicador home -->
    <rect x="140" y="450" width="40" height="3" rx="1.5" fill="#475569"/>

    <!-- Header dark -->
    <rect x="50" y="50" width="220" height="40" fill="#dc2626"/>
    <text x="160" y="76" text-anchor="middle" fill="#fff"
          font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">PAÑOL · TÓTEM</text>

    <!-- Operador actual -->
    <g transform="translate(60,100)">
      <text x="0" y="10" fill="#fbbf24" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="600">OPERANDO</text>
      <text x="0" y="26" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">Esteban Solís</text>
      <text x="0" y="42" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="9">PIN validado · turno: mañana</text>
    </g>

    <!-- Solicitud pendiente prominente -->
    <rect x="60" y="160" width="200" height="170" rx="8" fill="#1e293b" stroke="#dc2626" stroke-width="2"/>
    <text x="74" y="184" fill="#dc2626" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">SOLICITUD PENDIENTE</text>
    <text x="74" y="208" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">M. González</text>
    <text x="74" y="224" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="10">RUT 20.123.456-7</text>

    <!-- Lista items -->
    <g transform="translate(74,238)">
      <text x="0" y="0" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="10">• 1× Martillo carpintero</text>
      <text x="0" y="16" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="10">• 2× Llave 13mm</text>
      <text x="0" y="32" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="10">• 1× Cinta métrica</text>
    </g>

    <!-- Score IA -->
    <g transform="translate(74,300)">
      <rect width="172" height="20" rx="3" fill="#7c3aed"/>
      <text x="86" y="14" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">IA scoring: 0.87 · APROBAR</text>
    </g>

    <!-- Botones grandes touch -->
    <rect x="60" y="350" width="95" height="55" rx="6" fill="#16a34a"/>
    <text x="107" y="376" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">✓</text>
    <text x="107" y="396" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">ENTREGAR</text>

    <rect x="165" y="350" width="95" height="55" rx="6" fill="#dc2626"/>
    <text x="212" y="376" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">✕</text>
    <text x="212" y="396" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">RECHAZAR</text>

    <!-- Footer -->
    <text x="160" y="430" text-anchor="middle" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="8">tótem #1 · sede Viña</text>
  </g>

  <!-- ============ 3. ASISTENTE (chat panel) ============ -->
  <g transform="translate(820,100)">
    <text x="170" y="-10" text-anchor="middle" fill="#5b21b6"
          font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700"
          letter-spacing="2">ASISTENTE · CONVERSACIONAL</text>

    <!-- Contenedor chat -->
    <rect x="0" y="10" width="340" height="450" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Header chat -->
    <rect x="0" y="10" width="340" height="56" rx="14 14 0 0" fill="#7c3aed"/>
    <circle cx="30" cy="38" r="14" fill="#fff"/>
    <text x="30" y="44" text-anchor="middle" fill="#7c3aed" font-family="Arial" font-size="14" font-weight="700">🤖</text>
    <text x="55" y="35" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">Asistente Pañol</text>
    <text x="55" y="50" fill="#ddd6fe" font-family="Inter,Arial,sans-serif" font-size="9">en línea · MCP + GPT-4o-mini</text>

    <!-- Burbujas -->
    <!-- User -->
    <g transform="translate(60,82)">
      <rect width="270" height="48" rx="14" fill="#dbeafe"/>
      <text x="14" y="22" fill="#1e3a8a" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="600">María (alumna)</text>
      <text x="14" y="38" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="10">Necesito hacer un mueble de madera</text>
    </g>

    <!-- Bot -->
    <g transform="translate(10,144)">
      <rect width="280" height="92" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="14" y="22" fill="#5b21b6" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="600">🤖 Asistente</text>
      <text x="14" y="40" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="10">Te sugiero estos recursos:</text>
      <text x="14" y="55" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="10">• Martillo carpintero (3 disp.)</text>
      <text x="14" y="68" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="10">• Sierra de mano (1 disp.)</text>
      <text x="14" y="81" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="10">• Escuadra (12 disp.)</text>
    </g>

    <!-- Acción sugerida -->
    <g transform="translate(40,250)">
      <rect width="260" height="58" rx="8" fill="#7c3aed"/>
      <text x="130" y="22" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">¿Creo el borrador de solicitud?</text>
      <rect x="20" y="32" width="100" height="18" rx="4" fill="#fff"/>
      <text x="70" y="44" text-anchor="middle" fill="#7c3aed" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">SÍ, CREAR</text>
      <rect x="140" y="32" width="100" height="18" rx="4" fill="none" stroke="#fff"/>
      <text x="190" y="44" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700">PREGUNTAR MÁS</text>
    </g>

    <!-- User confirmando -->
    <g transform="translate(60,322)">
      <rect width="270" height="32" rx="14" fill="#dbeafe"/>
      <text x="14" y="20" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="10">Sí, créalo 👍</text>
    </g>

    <!-- Bot acción confirmada -->
    <g transform="translate(10,366)">
      <rect width="280" height="46" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="14" y="22" fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">✓ Borrador creado</text>
      <text x="14" y="38" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="10">Confirmá en /catálogo para reservar.</text>
    </g>

    <!-- Input -->
    <rect x="14" y="424" width="312" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="28" y="442" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="10">Escribí tu pregunta...</text>
    <circle cx="310" cy="438" r="10" fill="#7c3aed"/>
    <text x="310" y="442" text-anchor="middle" fill="#fff" font-family="Arial" font-size="9" font-weight="700">→</text>
  </g>

  <!-- Bus inferior con flechas -->
  <g transform="translate(0,560)">
    <text x="600" y="20" text-anchor="middle" fill="#94a3b8"
          font-family="Inter,Arial,sans-serif" font-size="11" font-style="italic">
      Las 3 UIs comparten el mismo backend (8 microservicios + RabbitMQ + Postgres)</text>
  </g>
</svg>

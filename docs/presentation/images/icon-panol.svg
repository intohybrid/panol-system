<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondo institucional -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)"/>

  <!-- Caja de herramientas / pañol -->
  <g transform="translate(100,100)">
    <!-- Cuerpo de la caja -->
    <rect x="-55" y="-15" width="110" height="55" rx="4" fill="#0f172a" stroke="#fff" stroke-width="2"/>

    <!-- Tapa abierta -->
    <path d="M -55 -15 L -55 -32 L 55 -32 L 55 -15 Z"
          fill="#1e293b" stroke="#fff" stroke-width="2"/>

    <!-- Manija -->
    <path d="M -18 -32 Q -18 -45 0 -45 Q 18 -45 18 -32"
          fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

    <!-- Línea separadora -->
    <line x1="-55" y1="-15" x2="55" y2="-15" stroke="#fff" stroke-width="1.5" opacity="0.6"/>

    <!-- Herramientas dentro: martillo -->
    <g transform="translate(-25,15)">
      <rect x="-3" y="-15" width="6" height="20" fill="url(#metalGrad)" rx="1"/>
      <rect x="-10" y="-22" width="20" height="10" rx="2" fill="url(#metalGrad)" stroke="#0f172a" stroke-width="0.5"/>
    </g>

    <!-- Llave -->
    <g transform="translate(0,18) rotate(-25)">
      <rect x="-2" y="-14" width="4" height="22" fill="url(#metalGrad)"/>
      <circle cx="0" cy="-15" r="6" fill="none" stroke="url(#metalGrad)" stroke-width="3"/>
      <rect x="-3" y="6" width="6" height="6" fill="url(#metalGrad)"/>
    </g>

    <!-- Destornillador -->
    <g transform="translate(25,16) rotate(15)">
      <rect x="-1.5" y="-16" width="3" height="18" fill="url(#metalGrad)"/>
      <rect x="-3" y="2" width="6" height="12" rx="1" fill="#dc2626"/>
    </g>
  </g>

  <!-- Símbolo de check (digital) en la esquina -->
  <g transform="translate(165,35)">
    <circle r="22" fill="#22c55e" stroke="#fff" stroke-width="3"/>
    <path d="M -10 0 L -3 7 L 11 -8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Texto inferior -->
  <text x="100" y="178" text-anchor="middle" fill="#fff"
        font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700"
        letter-spacing="2">PAÑOL</text>
</svg>

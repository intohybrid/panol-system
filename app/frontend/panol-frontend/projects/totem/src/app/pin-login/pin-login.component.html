<div class="pin-layout">
  <div class="pin-card">
    <div class="pin-header">
      <div class="logo-badge">P</div>
      <h1>Tótem Pañol</h1>
      <p class="subtitle">Ingreso Pañolero</p>
    </div>

    <div class="pin-display-container">
      <div class="pin-dots">
        <span class="dot" [class.filled]="pin().length >= 1"></span>
        <span class="dot" [class.filled]="pin().length >= 2"></span>
        <span class="dot" [class.filled]="pin().length >= 3"></span>
        <span class="dot" [class.filled]="pin().length >= 4"></span>
      </div>
      @if (error()) {
        <div class="error-msg">{{ error() }}</div>
      }
    </div>

    <div class="numpad">
      @for (row of [[1,2,3], [4,5,6], [7,8,9]]; track $index) {
        <div class="numpad-row">
          @for (digit of row; track digit) {
            <button class="num-btn" (click)="appendDigit(digit)" [disabled]="loading()">{{ digit }}</button>
          }
        </div>
      }
      <div class="numpad-row">
        <button class="num-btn action-btn" (click)="deleteDigit()" [disabled]="loading() || pin().length === 0">⌫</button>
        <button class="num-btn" (click)="appendDigit(0)" [disabled]="loading()">0</button>
        <button class="num-btn action-btn confirm-btn" (click)="submit()" [disabled]="loading() || pin().length !== 4">✓</button>
      </div>
    </div>
  </div>
</div>
